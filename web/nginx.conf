server {
    listen 80;
    server_name _;
    # 必须写 root: nginx:alpine 镜像编译时的默认 root 是 $prefix/html
    # = /etc/nginx/html, 文件并不在那里; 不写这行, 面板 / 和 /sub/* 都
    # 打不开 (404/500), 而容器本身能正常启动, 健康检查查不出来
    # (2026-11-19 实测, 和 web/sub-nginx.conf 同一个坑)。
    root /usr/share/nginx/html;

    # Panel — single static file, no backend API (the frontend is a
    # local generator; it never calls the server, see FRONTEND_CONTRACT.md).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Subscription endpoints the frontend generates:
    #   https://<domain>/sub/merged/<uuid>
    #   https://<domain>/sub/raw/<uuid>
    # install.sh writes merged.txt / raw.txt; nginx serves them here.
    # The <uuid> segment is not validated by nginx — the file is the
    # same for any uuid. Do not rely on this for access control.
    location ~ ^/sub/(merged|raw)/ {
        rewrite ^/sub/(merged|raw)/.*$ /sub/$1.txt break;
        default_type text/plain;
    }

    # Do not expose the panel publicly without auth / firewall rules.
    # Recommended: bind 8080 to localhost or restrict with ufw / Cloudflare Access.
}
