<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-Argo v1.0 自动化部署与运维系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen antialiased">
    <div class="max-w-6xl mx-auto px-4 py-6 space-y-6">
        <header class="flex justify-between pb-4 border-b border-slate-800">
            <h1 class="text-xl font-bold text-blue-400">Nexus-Argo 面板 v1.0</h1>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div class="lg:col-span-7 bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="text-xs font-bold text-blue-400">Argo 隧道与 Token</h3>
                <input type="password" id="argoToken" value="eyJhIjoiY2Y4N2..." oninput="updateOutputs()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200">
                <input type="text" id="nodeUuid" value="d3b41696-6a56-4c4f-9e32-2d1f9b3c4e5a" oninput="updateOutputs()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200">
            </div>
            <div class="lg:col-span-5 space-y-3.5">
                <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800">
                    <h3 class="text-xs font-bold text-blue-400 mb-1.5">SSH 一键部署命令</h3>
                    <div class="bg-slate-950 rounded-xl p-2.5 font-mono text-[11px] text-slate-300 select-all" id="sshCommand"></div>
                </div>
                <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800">
                    <div class="flex justify-between mb-2">
                        <h3 class="text-xs font-bold text-red-400">服务器一键卸载/清理命令</h3>
                        <button onclick="copyUninstallCommand()" class="px-2 py-0.5 bg-red-600/20 text-red-400 text-[11px] rounded border border-red-500/30">复制</button>
                    </div>
                    <div class="bg-slate-950 rounded-xl p-2.5 font-mono text-[11px] text-red-300 select-all">bash &lt;(curl -Ls https://raw.githubusercontent.com/Sid-x2026/Nexus-Argo/main/install.sh) uninstall</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function copyUninstallCommand() {
            navigator.clipboard.writeText("bash <(curl -Ls https://raw.githubusercontent.com/Sid-x2026/Nexus-Argo/main/install.sh) uninstall");
            alert("卸载命令已复制！");
        }
        function updateOutputs() {
            const uuid = document.getElementById('nodeUuid').value.trim();
            const token = document.getElementById('argoToken').value.trim();
            document.getElementById('sshCommand').innerText = `export NODE_UUID="${uuid}" \\\nexport ARGO_TOKEN="${token}" \\\nbash <(curl -Ls https://raw.githubusercontent.com/Sid-x2026/Nexus-Argo/main/install.sh)`;
        }
        window.onload = updateOutputs;
    </script>
</body>
</html>
